name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        # This securely logs into Docker using your hidden secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        # We prefix the image name with your Docker Hub username
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest .

      - name: Run Tests Inside Container
        run: docker run ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest pytest

      - name: Push to Docker Hub
        # This line ONLY runs if the pytest step above succeeds!
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-python-app:latest